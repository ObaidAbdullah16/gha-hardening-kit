# AFTER: least-privilege token, pinned actions, no curl|bash, no unnecessary third-party actions.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install tooling (pinned version + checksum)
        env:
          TOOL_VERSION: 1.4.2
          TOOL_SHA256: "copy-the-sha256-published-on-the-vendor-release-page"
        run: |
          curl -fsSLo tool.tgz "https://example.com/tool-${TOOL_VERSION}-linux-amd64.tgz"
          echo "${TOOL_SHA256}  tool.tgz" | sha256sum --check
          tar -xzf tool.tgz -C "$RUNNER_TEMP"
      - name: Changed files (plain git, no third-party action needed)
        run: git diff --name-only HEAD~1 HEAD || true
      - run: npm ci && npm test
