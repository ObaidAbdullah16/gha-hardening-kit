# AFTER: GitHub-hosted runners for untrusted code; the release job gets only the secret it needs.
name: Release
on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: make build
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
    secrets:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
