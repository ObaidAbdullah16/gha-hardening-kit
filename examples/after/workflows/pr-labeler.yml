# AFTER: pull_request_target is only used for labelling, which never runs PR code.
# Tests for fork PRs run in pull_request (no secrets, read-only token) - see ci.yml.
name: PR labeler
on:
  pull_request_target:
    types: [opened, synchronize]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6
        with:
          sync-labels: true
