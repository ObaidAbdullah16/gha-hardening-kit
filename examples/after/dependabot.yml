# AFTER: Dependabot keeps SHA-pinned actions up to date (it updates the SHA and the version comment).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7   # wait a week before adopting a new release (lets the community spot compromised versions)
    groups:
      actions:
        patterns: ["*"]
