name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      python-version: ${{ matrix.python }}
      install-command: pip install -e ".[dev]"
      test-command: ruff check ghaudit tests tools && pytest -q

  workflow-security:
    name: Workflow security (dogfooding)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write   # upload SARIF results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install tools
        run: pip install -e . -r .github/requirements-ci.txt
      - name: actionlint
        run: actionlint
      - name: Every action is pinned to a commit SHA
        run: python3 tools/pin_actions.py --check .
      - name: ghaudit self-scan (must score 90+)
        shell: bash  # -o pipefail: without it, "| tee" would hide a failing score
        run: |
          ghaudit scan . --fail-under 90 | tee ghaudit.txt
          ghaudit scan . --format sarif -o ghaudit.sarif
          {
            echo '### ghaudit self-scan'
            echo '```'
            cat ghaudit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: No exposure to known Actions supply-chain incidents
        run: ghaudit exposure . --no-history --fail-on-exposure
      - name: Upload ghaudit SARIF
        if: always() && hashFiles('ghaudit.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: ghaudit.sarif
          category: ghaudit
      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: "1.32.0"   # pinned like the other CI tools
          inputs: .github
          min-severity: low

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    name: Terraform module
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "<1.18.0"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive terraform
      - run: |
          terraform -chdir=terraform/examples/basic init -backend=false -input=false
          terraform -chdir=terraform/examples/basic validate
