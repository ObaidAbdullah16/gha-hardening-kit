# Builds the before/after hardening report and publishes it with GitHub Pages.
name: Hardening report (Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Build report
        run: |
          mkdir -p site
          ghaudit compare --root . \
            --before examples/before/workflows --after examples/after/workflows \
            --html site/index.html --markdown site/report.md \
            --banner "Demo: the 'before' workflows are deliberately insecure examples; 'after' shows the fixes. Generated by this repo's CI."
          ghaudit scan . --format json -o site/self-scan.json
          ghaudit scan . --workflows-dir examples/before/workflows --format sarif -o site/before.sarif
          cat site/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
