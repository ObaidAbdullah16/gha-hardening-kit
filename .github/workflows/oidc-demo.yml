# Proves "no long-lived keys": GitHub gives this job a short-lived OIDC token,
# AWS exchanges it for 1-hour credentials of a role that has zero permissions.
name: AWS OIDC demo
on:
  workflow_dispatch:

permissions: {}

jobs:
  whoami:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: aws
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check configuration
        if: vars.AWS_ROLE_ARN == ''
        run: |
          echo "::error::Repository variable AWS_ROLE_ARN is not set: start the AWS foundation on your laptop first (bash _setup/projects.sh up foundation)"
          exit 1
      - name: Is this repository connected to AWS?
        if: vars.AWS_ROLE_ARN == ''
        run: |
          echo "::error::Not connected to AWS (no AWS_ROLE_ARN variable). This demo needs a classic AWS account: accounts from the new AWS sign-up cannot create the GitHub OIDC provider."
          exit 1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
          role-session-name: gha-hardening-kit-demo
      - name: Who am I?
        run: |
          aws sts get-caller-identity --output table
          echo "### Logged in to AWS with OIDC - no access keys stored in GitHub" >> "$GITHUB_STEP_SUMMARY"
      - name: The role can do nothing else (expected AccessDenied)
        run: |
          if aws s3 ls >/dev/null 2>&1; then
            echo "::warning::This role can list buckets - it should have zero permissions"
          else
            echo "AccessDenied as expected: least privilege works."
          fi
